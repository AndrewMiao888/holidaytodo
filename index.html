<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Day Holiday Habit Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Animated Shifting Color Border */
        @keyframes borderShift {
            0% { border-color: #ec4899; box-shadow: 0 0 25px rgba(236, 72, 153, 0.25); }
            33% { border-color: #8b5cf6; box-shadow: 0 0 25px rgba(139, 92, 246, 0.25); }
            66% { border-color: #3b82f6; box-shadow: 0 0 25px rgba(59, 130, 246, 0.25); }
            100% { border-color: #ec4899; box-shadow: 0 0 25px rgba(236, 72, 153, 0.25); }
        }
        .shifting-border {
            border-width: 3px;
            animation: borderShift 8s infinite linear;
        }

        /* Custom scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body id="app-body" class="bg-gradient-to-br from-sky-400 via-indigo-500 to-purple-600 min-h-full text-slate-900 antialiased p-4 sm:p-8 transition-colors duration-700">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header Banner -->
        <header class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-2xl border border-white/40 dark:border-slate-800 flex flex-col md:flex-row items-center justify-between gap-6 transition-colors duration-500">
            <div>
                <div class="flex items-center gap-2 mb-2">
                    <span class="bg-pink-500 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Holiday Challenge</span>
                    <span id="theme-badge" class="bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-xs font-semibold px-2.5 py-0.5 rounded-full">Day Mode</span>
                </div>
                <h1 class="text-3xl sm:text-4xl font-extrabold bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent">10-Day Holiday Habit Tracker</h1>
                <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">Bright, clean, & automatically saved to your device. No dates, just pure progress!</p>
            </div>
            <div class="flex items-center gap-4 bg-slate-100 dark:bg-slate-800/80 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 w-full md:w-auto justify-around">
                <div class="text-center px-3">
                    <span id="overall-percentage" class="text-2xl font-extrabold text-pink-600 dark:text-pink-400">0%</span>
                    <span class="block text-xs font-bold text-slate-500 uppercase">Overall</span>
                </div>
                <div class="h-8 w-px bg-slate-300 dark:bg-slate-700"></div>
                <div class="text-center px-3">
                    <span id="days-completed" class="text-2xl font-extrabold text-purple-600 dark:text-purple-400">0/10</span>
                    <span class="block text-xs font-bold text-slate-500 uppercase">Days Done</span>
                </div>
                <button onclick="resetAllData()" class="ml-2 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl transition shadow-md shadow-rose-500/20 cursor-pointer">
                    Reset All
                </button>
            </div>
        </header>

        <!-- Sticky Day Navigation Tabs -->
        <nav aria-label="Days" class="sticky top-4 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md p-3 rounded-2xl shadow-lg border border-white/40 dark:border-slate-800 flex gap-2 overflow-x-auto no-scrollbar" id="day-tabs">
            <!-- Dynamically populated via JS -->
        </nav>

        <!-- Main Day Content Area with Shifting Border -->
        <main class="bg-white dark:bg-slate-900 backdrop-blur-md rounded-3xl p-6 sm:p-10 shadow-2xl shifting-border transition-colors duration-500" id="day-content-card">
            <!-- Populated via JS -->
        </main>
    </div>

    <!-- Motivational Popup Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl border border-slate-200 dark:border-slate-800 text-center space-y-4 transform transition-all">
            <div id="modal-icon" class="w-14 h-14 bg-pink-100 dark:bg-pink-950/60 text-pink-600 dark:text-pink-400 rounded-full flex items-center justify-center mx-auto text-2xl font-black">✨</div>
            <h3 id="modal-title" class="text-xl font-extrabold text-slate-900 dark:text-white">Awesome Job!</h3>
            <p id="modal-message" class="text-sm text-slate-600 dark:text-slate-300 font-medium leading-relaxed">Message goes here.</p>
            <button onclick="closeModal()" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-purple-500/30 cursor-pointer">Keep Crushing It!</button>
        </div>
    </div>

    <script>
        const TOTAL_DAYS = 10;
        let activeDay = 1;
        const MYOBRACE_DURATION = 2 * 60 * 60; // 2 hours in seconds

        const motivationalQuotes = [
            "Awesome job! Consistency is the magic key to success! ✨",
            "Crushing it! Every step forward makes you stronger! 💪",
            "Incredible work today! Take a moment to feel proud! 🌟",
            "You are unstoppable! Keep up this amazing momentum! 🚀",
            "Fantastic dedication! Your future self will thank you! 🎯",
            "Boom! Another goal conquered with absolute style! 🔥",
            "Look at you go! Habits built today create champions tomorrow! 👑",
            "Pure dedication! You're making massive progress step by step! ⭐"
        ];

        let quoteHistory = [];

        function getSmartQuote() {
            if (quoteHistory.length >= motivationalQuotes.length * 2) {
                quoteHistory = [];
            }
            const availableQuotes = motivationalQuotes.map((q, idx) => ({ q, idx })).filter(item => {
                const count = quoteHistory.filter(i => i === item.idx).length;
                return count < 2;
            });
            const chosen = availableQuotes[Math.floor(Math.random() * availableQuotes.length)];
            quoteHistory.push(chosen.idx);
            return chosen.q;
        }

        function loadState() {
            const saved = localStorage.getItem('holiday_habit_tracker_v3');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse saved state', e);
                }
            }
            const initialState = {};
            for (let i = 1; i <= TOTAL_DAYS; i++) {
                initialState[i] = {
                    myobrace: false,
                    myobraceSecondsLeft: MYOBRACE_DURATION,
                    myobraceRunning: false,
                    myobraceLaps: [],
                    exam1: false,
                    exam2: false,
                    bendDown: false,
                    jumpUp: false,
                    piano: [false, false, false, false],
                    flute: false,
                    run: false,
                    shineEyes1: false,
                    shineEyes2: false,
                    vitamin1: false,
                    vitamin2: false,
                    brushTeeth1: false,
                    brushTeeth2: false,
                    probiotic1: false,
                    probiotic2: false
                };
            }
            return initialState;
        }

        let trackerState = loadState();
        let globalTimerInterval = null;

        function saveState() {
            localStorage.setItem('holiday_habit_tracker_v3', JSON.stringify(trackerState));
            updateOverallStats();
        }

        function applyTimeTheme() {
            const hour = new Date().getHours();
            const body = document.getElementById('app-body');
            const badge = document.getElementById('theme-badge');

            if (hour >= 5 && hour < 12) {
                body.className = "bg-gradient-to-br from-amber-300 via-orange-400 to-pink-500 min-h-full text-slate-900 antialiased p-4 sm:p-8 transition-colors duration-700";
                badge.innerText = "🌅 Morning Bright";
            } else if (hour >= 12 && hour < 18) {
                body.className = "bg-gradient-to-br from-sky-400 via-indigo-500 to-purple-600 min-h-full text-slate-900 antialiased p-4 sm:p-8 transition-colors duration-700";
                badge.innerText = "☀️ Midday Flow";
            } else if (hour >= 18 && hour < 21) {
                body.className = "bg-gradient-to-br from-purple-500 via-pink-500 to-rose-600 min-h-full text-slate-900 antialiased p-4 sm:p-8 transition-colors duration-700";
                badge.innerText = "Sunset Glow";
            } else {
                body.className = "bg-gradient-to-br from-slate-900 via-indigo-950 to-purple-950 min-h-full text-white antialiased p-4 sm:p-8 transition-colors duration-700 dark";
                badge.innerText = "🌙 Night Serenity";
            }
        }

        function showModal(title, message, isSuccess = false) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            const iconDiv = document.getElementById('modal-icon');
            if (isSuccess) {
                iconDiv.className = 'w-14 h-14 bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl font-black';
                iconDiv.innerText = '✓';
            } else {
                iconDiv.className = 'w-14 h-14 bg-pink-100 dark:bg-pink-950 text-pink-600 dark:text-pink-400 rounded-full flex items-center justify-center mx-auto text-2xl font-black';
                iconDiv.innerText = '✨';
            }
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function resetAllData() {
            if (confirm("Are you sure you want to reset all progress across all 10 days?")) {
                stopMyobraceTimer();
                localStorage.removeItem('holiday_habit_tracker_v3');
                trackerState = loadState();
                renderTabs();
                renderDayContent();
                updateOverallStats();
                showModal('Reset Successful', 'All your habit tracking data has been cleared.');
            }
        }

        function getDayCompletion(dayNum) {
            const day = trackerState[dayNum];
            let completed = 0;
            let total = 19; // 1(myo) + 2(exam) + 1(bend) + 1(jump) + 4(piano) + 1(flute) + 1(run) + 2(shine) + 2(vitamins) + 2(teeth) + 2(probiotic) = 19 items

            if (day.myobrace) completed++;
            if (day.exam1) completed++;
            if (day.exam2) completed++;
            if (day.bendDown) completed++;
            if (day.jumpUp) completed++;
            day.piano.forEach(p => { if (p) completed++; });
            if (day.flute) completed++;
            if (day.run) completed++;
            if (day.shineEyes1) completed++;
            if (day.shineEyes2) completed++;
            if (day.vitamin1) completed++;
            if (day.vitamin2) completed++;
            if (day.brushTeeth1) completed++;
            if (day.brushTeeth2) completed++;
            if (day.probiotic1) completed++;
            if (day.probiotic2) completed++;

            return { completed, total, percentage: Math.round((completed / total) * 100) };
        }

        function updateOverallStats() {
            let totalCompletedAll = 0;
            let totalPossibleAll = 0;
            let fullyCompletedDays = 0;

            for (let i = 1; i <= TOTAL_DAYS; i++) {
                const stats = getDayCompletion(i);
                totalCompletedAll += stats.completed;
                totalPossibleAll += stats.total;
                if (stats.percentage === 100) fullyCompletedDays++;
            }

            const overallPct = Math.round((totalCompletedAll / totalPossibleAll) * 100) || 0;
            document.getElementById('overall-percentage').innerText = overallPct + '%';
            document.getElementById('days-completed').innerText = fullyCompletedDays + '/' + TOTAL_DAYS;
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('day-tabs');
            tabsContainer.innerHTML = '';

            for (let i = 1; i <= TOTAL_DAYS; i++) {
                const stats = getDayCompletion(i);
                const isActive = activeDay === i;
                const isComplete = stats.percentage === 100;

                const tab = document.createElement('button');
                tab.className = `flex-shrink-0 px-5 py-3 rounded-2xl font-bold text-sm transition flex flex-col items-center gap-1 border cursor-pointer ${
                    isActive 
                        ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white border-transparent shadow-lg shadow-purple-500/30 scale-105' 
                        : isComplete 
                            ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-300 dark:border-emerald-800 hover:bg-emerald-100' 
                            : 'bg-white/80 dark:bg-slate-800/80 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:bg-white'
                }`;
                
                tab.innerHTML = `
                    <div class="flex items-center gap-1.5">
                        <span>Day ${i}</span>
                        ${isComplete ? '<span class="text-xs">✓</span>' : ''}
                    </div>
                    <div class="w-12 bg-slate-200 dark:bg-slate-700 rounded-full h-1.5 overflow-hidden">
                        <div class="bg-current h-full rounded-full transition-all" style="width: ${stats.percentage}%"></div>
                    </div>
                `;
                tab.onclick = () => {
                    if (activeDay !== i) {
                        stopMyobraceTimer();
                        activeDay = i;
                        renderTabs();
                        renderDayContent();
                        checkAndManageTimerState();
                    }
                };
                tabsContainer.appendChild(tab);
            }
        }

        function formatTime(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function renderDayContent() {
            const card = document.getElementById('day-content-card');
            const dayData = trackerState[activeDay];
            const stats = getDayCompletion(activeDay);

            card.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-slate-200 dark:border-slate-800">
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Day ${activeDay} Routine</h2>
                            ${stats.percentage === 100 ? '<span class="bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-xs font-bold px-3 py-1 rounded-full">Day Completed! 🎉</span>' : ''}
                        </div>
                        <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Check off tasks as you complete them today. Your progress updates instantly.</p>
                    </div>
                    <div class="w-full sm:w-52 bg-slate-100 dark:bg-slate-800 rounded-2xl p-3.5 border border-slate-200 dark:border-slate-700">
                        <div class="flex justify-between text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">
                            <span>Daily Progress</span>
                            <span>${stats.completed}/${stats.total} (${stats.percentage}%)</span>
                        </div>
                        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2.5 overflow-hidden">
                            <div class="bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 h-full rounded-full transition-all duration-300" style="width: ${stats.percentage}%"></div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    <!-- Myobrace Interactive Timer Card -->
                    <div class="md:col-span-2 p-6 sm:p-8 rounded-3xl border ${dayData.myobrace ? 'bg-indigo-50/70 dark:bg-indigo-950/30 border-indigo-200 dark:border-indigo-900' : 'bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 text-white border-transparent'} shadow-xl transition-all">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                            <div>
                                <span class="text-xs font-bold px-3 py-1 bg-indigo-500/30 text-indigo-300 rounded-full uppercase tracking-wider">Dental Timer</span>
                                <h3 class="text-2xl font-extrabold mt-1.5 ${dayData.myobrace ? 'text-slate-900 dark:text-white' : 'text-white'}">Myobrace (2 Hours)</h3>
                                <p class="text-xs ${dayData.myobrace ? 'text-slate-600 dark:text-slate-400' : 'text-indigo-200'} mt-0.5">Countdown saves automatically and completes when finished.</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span id="timer-display" class="font-mono text-3xl sm:text-4xl font-black tracking-wider ${dayData.myobrace ? 'text-indigo-600 dark:text-indigo-400' : 'text-amber-300'}">
                                    ${formatTime(dayData.myobraceSecondsLeft)}
                                </span>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center gap-3 mt-4 pt-4 border-t ${dayData.myobrace ? 'border-indigo-200 dark:border-indigo-900' : 'border-indigo-800/60'}">
                            <button onclick="startMyobraceTimer()" id="btn-start" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-md cursor-pointer ${dayData.myobraceRunning ? 'opacity-50 cursor-not-allowed' : ''}">
                                Start Timer
                            </button>
                            <button onclick="stopMyobraceTimer()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-md cursor-pointer">
                                Stop
                            </button>
                            <button onclick="lapMyobraceTimer()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-md cursor-pointer">
                                Lap
                            </button>
                            <button onclick="cancelMyobraceTimer()" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-md cursor-pointer">
                                Cancel / Reset
                            </button>
                            <label class="ml-auto flex items-center gap-3 cursor-pointer bg-white/10 dark:bg-slate-800/60 px-4 py-2.5 rounded-xl border border-white/10">
                                <input type="checkbox" ${dayData.myobrace ? 'checked' : ''} onchange="toggleMyobraceManual()" class="w-5 h-5 text-indigo-600 rounded cursor-pointer flex-shrink-0">
                                <span class="text-xs font-bold ${dayData.myobrace ? 'text-slate-900 dark:text-white' : 'text-white'}">Mark Complete</span>
                            </label>
                        </div>

                        <!-- Laps display -->
                        <div id="laps-container" class="mt-4 flex flex-wrap gap-2">
                            ${dayData.myobraceLaps.map((lapTime, idx) => `
                                <span class="text-xs font-mono bg-indigo-500/20 text-indigo-200 px-3 py-1.5 rounded-lg border border-indigo-400/30">
                                    Lap ${idx + 1}: ${formatTime(lapTime)}
                                </span>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Exam Questions Session 1 -->
                    <label class="flex items-center gap-4 p-5 rounded-2xl border ${dayData.exam1 ? 'bg-pink-50/60 dark:bg-pink-950/30 border-pink-300 dark:border-pink-900' : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 hover:border-pink-300'} transition cursor-pointer shadow-sm">
                        <input type="checkbox" ${dayData.exam1 ? 'checked' : ''} onchange="toggleTask('exam1')" class="w-5 h-5 text-pink-600 rounded focus:ring-pink-500 cursor-pointer flex-shrink-0">
                        <div class="flex-1">
                            <span class="font-bold text-slate-900 dark:text-white block">Exam Questions (Session 1)</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 block mt-0.5">50 questions completed</span>
                        </div>
                        <span class="text-xs font-bold px-3 py-1.5 bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 rounded-xl h-fit">Study</span>
                    </label>

                    <!-- Exam Questions Session 2 -->
                    <label class="flex items-center gap-4 p-5 rounded-2xl border ${dayData.exam2 ? 'bg-pink-50/60 dark:bg-pink-950/30 border-pink-300 dark:border-pink-900' : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 hover:border-pink-300'} transition cursor-pointer shadow-sm">
                        <input type="checkbox" ${dayData.exam2 ? 'checked' : ''} onchange="toggleTask('exam2')" class="w-5 h-5 text-pink-600 rounded focus:ring-pink-500 cursor-pointer flex-shrink-0">
                        <div class="flex-1">
                            <span class="font-bold text-slate-900 dark:text-white block">Exam Questions (Session 2)</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 block mt-0.5">50 questions completed</span>
                        </div>
                        <span class="text-xs font-bold px-3 py-1.5 bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 rounded-xl h-fit">Study</span>
                    </label>

                    <!-- Exercise Bend Down -->
                    <label class="flex items-center gap-4 p-5 rounded-2xl border ${dayData.bendDown ? 'bg-pink-50/60 dark:bg-pink-950/30 border-pink-300 dark:border-pink-900' : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 hover:border-pink-300'} transition cursor-pointer shadow-sm">
                        <input type="checkbox" ${dayData.bendDown ? 'checked' : ''} onchange="toggleTask('bendDown')" class="w-5 h-5 text-pink-600 rounded focus:ring-pink-500 cursor-pointer flex-shrink-0">
                        <div class="flex-1">
                            <span class="font-bold text-slate-900 dark:text-white block">Exercise: Bend Down</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 block mt-0.5">20 repetitions</span>
                        </div>
                        <span class="text-xs font-bold px-3 py-1.5 bg-rose-100 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 rounded-xl h-fit">Fitness</span>
                    </label>

                    <!-- Exercise Jump Up -->
                    <label class="flex items-center gap-4 p-5 rounded-2xl border ${dayData.jumpUp ? 'bg-pink-50/60 dark:bg-pink-950/30 border-pink-300 dark:border-pink-900' : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 hover:border-pink-300'} transition cursor-pointer shadow-sm">
                        <input type="checkbox" ${dayData.jumpUp ? 'checked' : ''} onchange="toggleTask('jumpUp')" class="w-5 h-5 text-pink-600 rounded focus:ring-pink-500 cursor-pointer flex-shrink-0">
                        <div class="flex-1">
                            <span class="font-bold text-slate-900 dark:text-white block">Exercise: Jump Up</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 block mt-0.5">40 repetitions</span>
                        </div>
                        <span class="text-xs font-bold px-3 py-1.5 bg-rose-100 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 rounded-xl h-fit">Fitness</span>
                    </label>

                    <!-- 1km Run -->
                    <label class="flex items-center gap-4 p-5 rounded-2xl border ${dayData.run ? 'bg-pink-50/60 dark:bg-pink-950/30 border-pink-300 dark:border-pink-900' : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 hover:border-pink-300'} transition cursor-pointer shadow-sm">
                        <input type="checkbox" ${dayData.run ? 'checked' : ''} onchange="toggleTask('run')" class="w-5 h-5 text-pink-600 rounded focus:ring-pink-500 cursor-pointer flex-shrink-0">
                        <div class="flex-1">
                            <span class="font-bold text-slate-900 dark:text-white block">1km Run</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 block mt-0.5">Outdoor or treadmill run</span>
                        </div>
                        <span class="text-xs font-bold px-3 py-1.5 bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 rounded-xl h-fit">Cardio</span>
                    </label>

                    <!-- Flute Practice -->
                    <label class="flex items-center gap-4 p-5 rounded-2xl border ${dayData.flute ? 'bg-pink-50/60 dark:bg-pink-950/30 border-pink-300 dark:border-pink-900' : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 hover:border-pink-300'} transition cursor-pointer shadow-sm">
                        <input type="checkbox" ${dayData.flute ? 'checked' : ''} onchange="toggleTask('flute')" class="w-5 h-5 text-pink-600 rounded focus:ring-pink-500 cursor-pointer flex-shrink-0">
                        <div class="flex-1">
                            <span class="font-bold text-slate-900 dark:text-white block">Flute Practice</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 block mt-0.5">Daily practice session</span>
                        </div>
                        <span class="text-xs font-bold px-3 py-1.5 bg-purple-100 dark:bg-purple-950/60 text-purple-700 dark:text-purple-300 rounded-xl h-fit">Music</span>
                    </label>

                    <!-- Shine the Eyes (x2) -->
                    <div class="p-5 rounded-2xl border bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                        <div>
                            <span class="font-bold text-slate-900 dark:text-white block mb-1">Shine the Eyes (x2)</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 block mb-3">Check off each session</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center justify-center gap-3 p-3 rounded-xl border ${dayData.shineEyes1 ? 'bg-teal-100 dark:bg-teal-950/60 border-teal-300 dark:border-teal-800 text-teal-900 dark:text-teal-200' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'} cursor-pointer transition">
                                <input type="checkbox" ${dayData.shineEyes1 ? 'checked' : ''} onchange="toggleSubTask('shineEyes1')" class="w-5 h-5 text-teal-600 rounded cursor-pointer flex-shrink-0">
                                <span class="text-xs font-bold">Session 1</span>
                            </label>
                            <label class="flex items-center justify-center gap-3 p-3 rounded-xl border ${dayData.shineEyes2 ? 'bg-teal-100 dark:bg-teal-950/60 border-teal-300 dark:border-teal-800 text-teal-900 dark:text-teal-200' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'} cursor-pointer transition">
                                <input type="checkbox" ${dayData.shineEyes2 ? 'checked' : ''} onchange="toggleSubTask('shineEyes2')" class="w-5 h-5 text-teal-600 rounded cursor-pointer flex-shrink-0">
                                <span class="text-xs font-bold">Session 2</span>
                            </label>
                        </div>
                    </div>

                    <!-- Vitamin Tablets (x2) -->
                    <div class="p-5 rounded-2xl border bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                        <div>
                            <span class="font-bold text-slate-900 dark:text-white block mb-1">Vitamin Tablets (x2)</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 block mb-3">Check off each dose</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center justify-center gap-3 p-3 rounded-xl border ${dayData.vitamin1 ? 'bg-sky-100 dark:bg-sky-950/60 border-sky-300 dark:border-sky-800 text-sky-900 dark:text-sky-200' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'} cursor-pointer transition">
                                <input type="checkbox" ${dayData.vitamin1 ? 'checked' : ''} onchange="toggleSubTask('vitamin1')" class="w-5 h-5 text-sky-600 rounded cursor-pointer flex-shrink-0">
                                <span class="text-xs font-bold">Dose 1</span>
                            </label>
                            <label class="flex items-center justify-center gap-3 p-3 rounded-xl border ${dayData.vitamin2 ? 'bg-sky-100 dark:bg-sky-950/60 border-sky-300 dark:border-sky-800 text-sky-900 dark:text-sky-200' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'} cursor-pointer transition">
                                <input type="checkbox" ${dayData.vitamin2 ? 'checked' : ''} onchange="toggleSubTask('vitamin2')" class="w-5 h-5 text-sky-600 rounded cursor-pointer flex-shrink-0">
                                <span class="text-xs font-bold">Dose 2</span>
                            </label>
                        </div>
                    </div>

                    <!-- Brush Teeth (x2) -->
                    <div class="p-5 rounded-2xl border bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                        <div>
                            <span class="font-bold text-slate-900 dark:text-white block mb-1">Brush Teeth (x2)</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 block mb-3">Morning & Evening</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center justify-center gap-3 p-3 rounded-xl border ${dayData.brushTeeth1 ? 'bg-blue-100 dark:bg-blue-950/60 border-blue-300 dark:border-blue-800 text-blue-900 dark:text-blue-200' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'} cursor-pointer transition">
                                <input type="checkbox" ${dayData.brushTeeth1 ? 'checked' : ''} onchange="toggleSubTask('brushTeeth1')" class="w-5 h-5 text-blue-600 rounded cursor-pointer flex-shrink-0">
                                <span class="text-xs font-bold">Session 1</span>
                            </label>
                            <label class="flex items-center justify-center gap-3 p-3 rounded-xl border ${dayData.brushTeeth2 ? 'bg-blue-100 dark:bg-blue-950/60 border-blue-300 dark:border-blue-800 text-blue-900 dark:text-blue-200' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'} cursor-pointer transition">
                                <input type="checkbox" ${dayData.brushTeeth2 ? 'checked' : ''} onchange="toggleSubTask('brushTeeth2')" class="w-5 h-5 text-blue-600 rounded cursor-pointer flex-shrink-0">
                                <span class="text-xs font-bold">Session 2</span>
                            </label>
                        </div>
                    </div>

                    <!-- Probiotic (x2) -->
                    <div class="p-5 rounded-2xl border bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                        <div>
                            <span class="font-bold text-slate-900 dark:text-white block mb-1">Probiotic (x2)</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 block mb-3">Check off each dose</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center justify-center gap-3 p-3 rounded-xl border ${dayData.probiotic1 ? 'bg-emerald-100 dark:bg-emerald-950/60 border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'} cursor-pointer transition">
                                <input type="checkbox" ${dayData.probiotic1 ? 'checked' : ''} onchange="toggleSubTask('probiotic1')" class="w-5 h-5 text-emerald-600 rounded cursor-pointer flex-shrink-0">
                                <span class="text-xs font-bold">Dose 1</span>
                            </label>
                            <label class="flex items-center justify-center gap-3 p-3 rounded-xl border ${dayData.probiotic2 ? 'bg-emerald-100 dark:bg-emerald-950/60 border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'} cursor-pointer transition">
                                <input type="checkbox" ${dayData.probiotic2 ? 'checked' : ''} onchange="toggleSubTask('probiotic2')" class="w-5 h-5 text-emerald-600 rounded cursor-pointer flex-shrink-0">
                                <span class="text-xs font-bold">Dose 2</span>
                            </label>
                        </div>
                    </div>

                    <!-- Piano Pieces (4 checkboxes) -->
                    <div class="md:col-span-2 p-5 rounded-2xl border bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                        <div>
                            <span class="font-bold text-slate-900 dark:text-white block mb-1">Piano Practice (4 Pieces)</span>
                            <span class="text-xs text-slate-500 dark:text-slate-400 block mb-3">Check off each piece as you practice it</span>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            ${dayData.piano.map((checked, idx) => `
                                <label class="flex items-center justify-center gap-3 p-3 rounded-xl border ${checked ? 'bg-purple-100 dark:bg-purple-950/60 border-purple-300 dark:border-purple-800 text-purple-900 dark:text-purple-200' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'} cursor-pointer transition">
                                    <input type="checkbox" ${checked ? 'checked' : ''} onchange="togglePiano(${idx})" class="w-5 h-5 text-purple-600 rounded cursor-pointer flex-shrink-0">
                                    <span class="text-xs font-bold">Piece ${idx + 1}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>

                </div>
            `;
            checkAndManageTimerState();
        }

        function checkAndManageTimerState() {
            const dayData = trackerState[activeDay];
            if (dayData.myobraceRunning) {
                if (!globalTimerInterval) {
                    globalTimerInterval = setInterval(() => {
                        if (trackerState[activeDay].myobraceSecondsLeft > 0) {
                            trackerState[activeDay].myobraceSecondsLeft--;
                            saveState();
                            const display = document.getElementById('timer-display');
                            if (display) display.innerText = formatTime(trackerState[activeDay].myobraceSecondsLeft);
                        } else {
                            trackerState[activeDay].myobraceRunning = false;
                            trackerState[activeDay].myobrace = true;
                            clearInterval(globalTimerInterval);
                            globalTimerInterval = null;
                            saveState();
                            renderTabs();
                            renderDayContent();
                            showModal("Myobrace Completed! 🎉", "Fantastic job! Your 2 hours of Myobrace wear time is fully complete.", true);
                        }
                    }, 1000);
                }
            } else {
                if (globalTimerInterval) {
                    clearInterval(globalTimerInterval);
                    globalTimerInterval = null;
                }
            }
        }

        function startMyobraceTimer() {
            const dayData = trackerState[activeDay];
            if (dayData.myobrace) return;
            if (!dayData.myobraceRunning) {
                dayData.myobraceRunning = true;
                saveState();
                renderDayContent();
            }
        }

        function stopMyobraceTimer() {
            const dayData = trackerState[activeDay];
            if (dayData.myobraceRunning) {
                dayData.myobraceRunning = false;
                if (globalTimerInterval) {
                    clearInterval(globalTimerInterval);
                    globalTimerInterval = null;
                }
                saveState();
                renderDayContent();
            }
        }

        function lapMyobraceTimer() {
            const dayData = trackerState[activeDay];
            const elapsed = MYOBRACE_DURATION - dayData.myobraceSecondsLeft;
            dayData.myobraceLaps.push(elapsed);
            saveState();
            renderDayContent();
        }

        function cancelMyobraceTimer() {
            stopMyobraceTimer();
            const dayData = trackerState[activeDay];
            dayData.myobraceSecondsLeft = MYOBRACE_DURATION;
            dayData.myobraceLaps = [];
            dayData.myobrace = false;
            saveState();
            renderDayContent();
            renderTabs();
        }

        function toggleMyobraceManual() {
            const dayData = trackerState[activeDay];
            dayData.myobrace = !dayData.myobrace;
            if (dayData.myobrace) {
                stopMyobraceTimer();
                dayData.myobraceSecondsLeft = 0;
                showModal("Goal Reached! 🌟", getSmartQuote(), true);
            } else {
                dayData.myobraceSecondsLeft = MYOBRACE_DURATION;
            }
            saveState();
            renderTabs();
            renderDayContent();
        }

        function toggleTask(taskKey) {
            trackerState[activeDay][taskKey] = !trackerState[activeDay][taskKey];
            saveState();
            if (trackerState[activeDay][taskKey]) {
                showModal("Goal Reached! 🌟", getSmartQuote(), true);
            }
            renderTabs();
            renderDayContent();
        }

        function toggleSubTask(taskKey) {
            trackerState[activeDay][taskKey] = !trackerState[activeDay][taskKey];
            saveState();
            if (trackerState[activeDay][taskKey]) {
                showModal("Goal Reached! 🌟", getSmartQuote(), true);
            }
            renderTabs();
            renderDayContent();
        }

        function togglePiano(index) {
            trackerState[activeDay].piano[index] = !trackerState[activeDay].piano[index];
            saveState();
            if (trackerState[activeDay].piano[index]) {
                showModal("Goal Reached! 🌟", getSmartQuote(), true);
            }
            renderTabs();
            renderDayContent();
        }

        window.onload = function() {
            applyTimeTheme();
            renderTabs();
            renderDayContent();
            updateOverallStats();
        };
    </script>
</body>
</html>
